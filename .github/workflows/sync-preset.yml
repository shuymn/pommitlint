name: Sync Preset
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "tools/sync-preset/package.json"
      - "tools/sync-preset/bun.lock"

concurrency:
  group: sync-preset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Always regenerate from the current lockfile; an older sync commit is not
      # evidence that a refreshed Renovate branch still has the correct preset.
      - name: Run sync-preset
        id: sync
        run: |
          (cd tools/sync-preset && bun install --frozen-lockfile)
          go run ./tools/sync-preset
          if ! git diff --quiet -- internal/preset/preset.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.sync.outputs.changed == 'true'
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      # GitHub signs API-created commits. expectedHeadOid rejects a concurrent
      # branch update instead of committing a preset generated from stale inputs.
      - name: Commit the preset through GitHub
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          query=$(cat <<'GRAPHQL'
          mutation($repo: String!, $branch: String!, $head: GitObjectID!, $content: Base64String!) {
            createCommitOnBranch(input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $head,
              message: {headline: "chore: sync preset"},
              fileChanges: {additions: [{path: "internal/preset/preset.json", contents: $content}]}
            }) { commit { oid } }
          }
          GRAPHQL
          )
          gh api graphql -f query="$query" \
            -f repo="$GITHUB_REPOSITORY" -f branch="$HEAD_BRANCH" -f head="$EXPECTED_HEAD" \
            -f content="$(base64 < internal/preset/preset.json | tr -d '\n')"
