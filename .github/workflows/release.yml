name: Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  GO_LICENSES_VERSION: v2.0.1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check publication eligibility
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash tools/release/check-publish.sh

      - name: Set up Go
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate third-party licenses
        if: steps.guard.outputs.publish == 'true'
        run: |
          go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION:?}"
          # Dependencies differ by target OS (cobra pulls in mousetrap on Windows),
          # so collect the licenses for every GOOS that .goreleaser.yml builds.
          rm -rf third_party_licenses
          mkdir third_party_licenses
          for goos in linux darwin windows; do
            GOOS="$goos" go-licenses save ./... --save_path="$RUNNER_TEMP/licenses-$goos" --force
            # go-licenses writes read-only files; -f replaces the ones an earlier GOOS saved.
            cp -Rf "$RUNNER_TEMP/licenses-$goos/." third_party_licenses/
          done

      - name: Run GoReleaser
        if: steps.guard.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish draft release
        if: steps.guard.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MAKE_LATEST: ${{ steps.guard.outputs.latest }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"; then
              exit 0
            fi
            if (( attempt < 5 )); then sleep "$((attempt * 5))"; fi
          done
          echo "failed to publish release after retries" >&2
          exit 1
