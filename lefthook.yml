assert_lefthook_installed: true
glob_matcher: doublestar
no_tty: true
skip_lfs: true

output:
  - summary
  - failure
  - execution
  - execution_out

pre-commit:
  piped: true

  commands:
    fmt:
      tags: [format]
      glob: "**/*.go"
      run: mise run fmt:fix {staged_files}
      stage_fixed: true

    fmt:ts:
      tags: [format]
      glob: "tools/**/*.ts"
      run: mise run fmt:fix:ts
      stage_fixed: true

    lint:
      tags: [lint]
      glob: "**/*.go"
      run: mise run lint

    lint:ts:
      tags: [lint]
      glob: "tools/**/*.ts"
      run: mise run lint:ts

    tidy:
      tags: [deps]
      glob: "go.mod,go.sum"
      run: mise run tidy

    build:
      tags: [build]
      glob: "**/*.go"
      run: mise run build

    actionlint:
      tags: [lint]
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint

    ghalint:
      tags: [lint]
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run

    betterleaks:
      tags: [security]
      run: mise run secrets:staged

  skip:
    - merge: true
    - rebase: true

commit-msg:
  commands:
    pommitlint:
      run: mise run lint:commit-msg {1}

pre-push:
  piped: true
  commands:
    checks:
      tags: [build, test, deps]
      run: mise run check:full
